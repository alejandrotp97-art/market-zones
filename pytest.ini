[pytest]
# Los tests viven en dos sitios: la suite del núcleo y la del panel de régimen,
# que es su propio paquete. Nombrarlos aquí evita que `pytest` a secas se deje
# la mitad — que es como una suite pasa a estar verde y a no cubrir nada.
testpaths = tests regime/tests

addopts = -q --strict-markers

filterwarnings =
    # `test_band_vol_ignores_bad_bars_without_faking_a_return` mete a propósito
    # una barra con cierre 0 para comprobar que no envenena el resultado. El
    # `np.log(0)` de ese test avisa 121 veces y entierra cualquier aviso que SÍ
    # importe, así que se silencia ese mensaje y sólo ese.
    ignore:divide by zero encountered in log:RuntimeWarning
